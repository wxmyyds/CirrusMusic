# Tests only. Production packages are built by the three *-build workflows.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to test (empty uses the selected workflow commit)
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.platform }} tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-22.04
            arch: x86_64
          - platform: Windows
            runner: windows-2022
            arch: x86_64
          - platform: macOS
            runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Linux test dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux
        with:
          distribution: ubuntu
          arch: ${{ matrix.arch }}
          cache-scope: tests

      - name: Set up Windows test dependencies
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows
        with:
          arch: ${{ matrix.arch }}

      - name: Set up macOS test dependencies
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-macos
        with:
          arch: ${{ matrix.arch }}
          cache-scope: tests

      - name: Configure test build
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCIRRUS_DEPLOY_QT=OFF \
            -DCMAKE_PREFIX_PATH="$CIRRUS_CMAKE_PREFIX_PATH" \
            -DPKG_CONFIG_EXECUTABLE="$CIRRUS_PKG_CONFIG_EXECUTABLE" \
            -DOPENSSL_ROOT_DIR="$CIRRUS_OPENSSL_ROOT" \
            -DCMAKE_C_COMPILER_LAUNCHER="$CIRRUS_COMPILER_LAUNCHER" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$CIRRUS_COMPILER_LAUNCHER"

      - name: Compile test dependencies
        run: cmake --build build --parallel 4 -- -k 0

      - name: QML lint
        run: cmake --build build --target all_qmllint

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          command=(ctest --test-dir build --output-on-failure --no-tests=error --parallel 4
            --output-junit "$PWD/build/junit.xml")
          if [[ $RUNNER_OS == Linux ]]; then
            dbus-run-session -- "${command[@]}"
          else
            "${command[@]}"
          fi

      - name: Save compiler cache
        if: always() && env.CIRRUS_CCACHE_KEY != '' && env.CIRRUS_CCACHE_HIT != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CIRRUS_CCACHE_KEY }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/junit.xml
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
