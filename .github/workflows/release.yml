# Pushing a tag vX.Y.Z builds the packages and puts them in a draft GitHub release
# (packaging/README.md). The maintainer reviews the draft and publishes it.
# The tag must match project(VERSION) in CMakeLists.txt and have a CHANGELOG.md section.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sed -nE 's/^project\(CirrusMusic VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Tests run on the tagged commit before anything is packaged.
  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  linux:
    needs: ci
    uses: ./.github/workflows/linux-packages.yml

  pacman:
    needs: ci
    uses: ./.github/workflows/pacman.yml

  windows:
    needs: ci
    uses: ./.github/workflows/windows.yml
    with:
      package: true

  macos:
    needs: ci
    uses: ./.github/workflows/macos.yml
    with:
      package: true

  release:
    name: Draft release
    needs: [check, linux, pacman, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          find artifacts -maxdepth 2 -type f -exec mv {} dist/ \;
          tar -C artifacts/linux -cf dist/Cirrus-$VERSION-library-sources.tar sources
          (cd dist && sha256sum * > SHA256SUMS.txt)
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Cirrus $VERSION" --notes-file notes.md dist/*
