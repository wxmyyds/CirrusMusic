# Six native distribution/CPU builds. No tests and no publication here.
name: Linux build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to build (empty uses the selected workflow commit)
        type: string
        default: ''
      distribution:
        description: Linux distribution packages to build
        type: choice
        options: [all, arch, debian, fedora]
        default: all
      architecture:
        description: Native package architecture to build
        type: choice
        options: [all, x86_64, arm64]
        default: all
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      distribution:
        type: string
        default: all
      architecture:
        type: string
        default: all

permissions:
  contents: read

jobs:
  resolve-source:
    name: Resolve exact package source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  prepare-build:
    name: Select package targets
    runs-on: ubuntu-24.04
    needs: resolve-source
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        name: Validate and select native package matrix
        env:
          DISTRIBUTION: ${{ inputs.distribution || 'all' }}
          ARCHITECTURE: ${{ inputs.architecture || 'all' }}
        run: |
          set -euo pipefail
          selection=$(python3 tools/ci/select-native-matrix.py linux-build "$DISTRIBUTION" "$ARCHITECTURE")
          echo "matrix=$(jq -c '.matrix' <<<"$selection")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.distribution }} ${{ matrix.arch }}
    needs: [resolve-source, prepare-build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-build.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
      # pacman applies Landlock before setting no_new_privs itself. Container
      # root has no CAP_SYS_ADMIN, so set no_new_privs before bootstrap.
      options: --user 0 --security-opt no-new-privileges
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DISTRIBUTION: ${{ matrix.distribution }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Bootstrap native distribution tools
        run: |
          set -euo pipefail
          case "$DISTRIBUTION" in
            arch) pacman -Syu --noconfirm --needed git ca-certificates tar gzip ;;
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates tar gzip
              ;;
            fedora) dnf install -y git ca-certificates tar gzip ;;
            *) echo "::error::Unsupported build distribution: $DISTRIBUTION"; exit 2 ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        with:
          distribution: ${{ matrix.distribution }}
          arch: ${{ matrix.arch }}

      - name: Build native package as unprivileged user
        run: |
          set -euo pipefail
          useradd --create-home cirrus-builder
          chown -R cirrus-builder:cirrus-builder "$GITHUB_WORKSPACE"
          if [[ $DISTRIBUTION == arch ]]; then
            runuser -u cirrus-builder -- packaging/linux/arch/build-package.sh "$TARGET_ARCH" "$GITHUB_WORKSPACE/dist"
          else
            runuser -u cirrus-builder -- "packaging/linux/$DISTRIBUTION/build-package.sh" \
              "$TARGET_ARCH" "$GITHUB_WORKSPACE/dist"
          fi

      - name: Collect corresponding bundled-library sources once
        if: matrix.collect_sources == true
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(CirrusMusic VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          packaging/fetch-sources.sh "$GITHUB_WORKSPACE/build/library-sources"
          mkdir -p "$GITHUB_WORKSPACE/build/library-source-artifact"
          tar -C "$GITHUB_WORKSPACE/build" -cJf "$GITHUB_WORKSPACE/build/library-source-artifact/Cirrus-$version-library-sources.tar.xz" library-sources

      - name: Save compiler cache
        if: always() && env.CIRRUS_CCACHE_KEY != '' && env.CIRRUS_CCACHE_HIT != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CIRRUS_CCACHE_KEY }}

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: cirrus-linux-${{ matrix.distribution }}-${{ matrix.arch }}
          retention-days: 1
          overwrite: ${{ github.run_attempt > 1 }}
          path: |
            dist/cirrus-*.pkg.tar.zst
            dist/cirrus_*.deb
            dist/cirrus-*.rpm
          if-no-files-found: error

      - name: Upload bundled-library sources separately
        if: matrix.collect_sources == true
        uses: actions/upload-artifact@v7
        with:
          name: cirrus-library-sources
          retention-days: 1
          overwrite: ${{ github.run_attempt > 1 }}
          path: build/library-source-artifact/Cirrus-*-library-sources.tar.xz
          if-no-files-found: error
