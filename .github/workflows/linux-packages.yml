# Linux packaging entry point: deb/AppImage + bundled-library sources ("linux")
# and native Arch ("pacman"). Release builds all; CI asks for portable packages
# only. Run workflow can select all, portable or arch (packaging/README.md).
name: Linux packages

on:
  workflow_dispatch:
    inputs:
      format:
        description: Linux package format (all, deb/AppImage, or Arch only)
        type: choice
        options: [all, portable, arch]
        default: all
  workflow_call:
    inputs:
      format:
        description: all, portable (deb/AppImage), or arch
        type: string
        default: all

permissions:
  contents: read

env:
  QT_VERSION: 6.11.2
  QT_MODULES: qtmultimedia qtshadertools qtimageformats

jobs:
  select:
    name: Validate package selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      format: ${{ steps.selection.outputs.format }}
    steps:
      - id: selection
        env:
          PACKAGE_FORMAT: ${{ inputs.format }}
        run: |
          case "$PACKAGE_FORMAT" in
            all|portable|arch) echo "format=$PACKAGE_FORMAT" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unsupported Linux package format"; exit 1 ;;
          esac

  linux:
    name: deb and AppImage packages
    needs: select
    if: needs.select.outputs.format != 'arch'
    runs-on: ubuntu-22.04
    env:
      DEPS: ${{ github.workspace }}/../deps
      CCACHE_DIR: ${{ github.workspace }}/../ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_BASEDIR: ${{ github.workspace }}
      # build-packages.sh configures its own build; CMake reads the launchers from here.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: packaging/linux/install-build-deps.sh

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      # Same key as CI, so a package build reuses CI's FFmpeg and QtKeychain.
      - name: Restore FFmpeg and QtKeychain
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPS }}
          key: deps-linux-ubuntu22.04-${{ hashFiles('packaging/deps/*.sh') }}

      - name: Build FFmpeg and QtKeychain
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          packaging/deps/build-ffmpeg.sh "$DEPS"
          packaging/deps/build-qtkeychain.sh "$DEPS" "$QT_ROOT_DIR"

      - name: Save FFmpeg and QtKeychain
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DEPS }}
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # The package build has its own configuration (no tests, no gallery), so its own cache.
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-package-${{ github.sha }}
          restore-keys: ccache-linux-package-

      - name: deb and AppImage
        run: packaging/linux/build-packages.sh "$QT_ROOT_DIR" "$DEPS" dist deb appimage

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-package-${{ github.sha }}

      - name: Check the desktop metadata
        run: |
          # Ubuntu 22.04's desktop-file-validate (0.26) predates SingleMainWindow (desktop
          # entry spec 1.5); any other error still fails.
          out=$(desktop-file-validate \
            build/package-linux/deb/usr/share/applications/com.guang233.Cirrus.desktop 2>&1) || true
          echo "$out"
          if grep -v '"SingleMainWindow"' <<< "$out" | grep -q 'error:'; then exit 1; fi
          # Ubuntu 22.04's appstream (0.15) predates some current tags: report, don't fail.
          appstreamcli validate --no-net \
            build/package-linux/deb/usr/share/metainfo/com.guang233.Cirrus.metainfo.xml ||
            echo "::warning::appstreamcli reported problems in the metainfo"

      - name: Check the deb
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'usr/bin/cirrus|opt/cirrus/bin/cirrus|applications/'

      - name: Sources of the bundled libraries
        run: packaging/deps/fetch-sources.sh dist/sources

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  pacman:
    name: Arch Linux package
    needs: select
    if: needs.select.outputs.format != 'portable'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      # Git must be available before checkout so it creates a real repository for
      # git archive. Upgrade the whole rolling-release system, not selected libraries.
      - name: Native Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel gcc-libs glibc git util-linux cmake ninja pkgconf \
            qt6-base qt6-declarative qt6-multimedia qt6-multimedia-ffmpeg \
            qt6-wayland qt6-imageformats qt6-shadertools qt6-tools \
            qtkeychain-qt6 ffmpeg openssl zlib zstd hicolor-icon-theme \
            ca-certificates libsecret

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only dependency installation and user setup run as root. The builder owns
      # the checkout and never needs sudo or makepkg --syncdeps.
      - name: Create unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build and check pacman package
        run: runuser -u builder -- bash packaging/arch/build-package.sh dist/pacman

      - uses: actions/upload-artifact@v7
        with:
          name: pacman
          path: dist/pacman/*.pkg.tar.zst
          if-no-files-found: error
