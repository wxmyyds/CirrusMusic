# Production DMGs only. Root CI owns application builds, lint and tests.
name: macOS build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref or SHA (empty uses the workflow commit)
        type: string
        required: false
        default: ""
      architecture:
        description: Native macOS package architecture to build
        type: choice
        options: [all, x86_64, arm64]
        default: all
  workflow_call:
    inputs:
      ref:
        description: Source SHA supplied by the release workflow
        type: string
        required: false
        default: ""
      architecture:
        type: string
        default: all

permissions:
  contents: read

jobs:
  resolve-source:
    name: Resolve exact package source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  select-target:
    name: Select macOS architecture
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        env:
          ARCHITECTURE: ${{ inputs.architecture || 'all' }}
        run: |
          set -euo pipefail
          selection=$(python3 tools/ci/select-native-matrix.py macos-build "$ARCHITECTURE")
          echo "matrix=$(jq -c '.matrix' <<<"$selection")" >> "$GITHUB_OUTPUT"

  package:
    name: macOS ${{ matrix.arch }} DMG
    needs: [resolve-source, select-target]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-target.outputs.matrix) }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      JOBS: "4"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out package source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - name: Set up native macOS dependencies
        uses: ./.github/actions/setup-macos
        with:
          arch: ${{ matrix.arch }}

      - name: Build and validate DMG
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: packaging/macos/build-package.sh "$PACKAGE_ARCH" "$QT_ROOT_DIR" "$DEPS" dist

      - name: Save native compiler output
        if: ${{ always() && env.CIRRUS_CCACHE_KEY != '' && env.CIRRUS_CCACHE_HIT != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CIRRUS_CCACHE_KEY }}

      - name: Upload native DMG
        uses: actions/upload-artifact@v7
        with:
          name: cirrus-macos-${{ matrix.arch }}
          retention-days: 1
          overwrite: ${{ github.run_attempt > 1 }}
          path: dist/Cirrus-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
