name: Set up Linux build dependencies
description: Native distribution dependencies, Qt and the shared CI build environment
inputs:
  distribution:
    description: arch, debian, or fedora
    required: true
  arch:
    description: Native CPU (x86_64 or arm64)
    required: true
  cache-scope:
    description: Compiler-cache scope (build or tests)
    default: build
runs:
  using: composite
  steps:
    - name: Verify native Linux CPU
      shell: bash
      env:
        REQUESTED_ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        case "$REQUESTED_ARCH" in
          x86_64) native=x86_64 ;;
          arm64) native=aarch64 ;;
          *) echo "::error::Unsupported Linux architecture"; exit 1 ;;
        esac
        [[ $(uname -s) == Linux && $(uname -m) == "$native" ]]
        {
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/build-ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=800M"
        } >> "$GITHUB_ENV"

    - name: Install native distribution packages
      shell: bash
      env:
        DISTRIBUTION: ${{ inputs.distribution }}
      run: packaging/linux/install-build-deps.sh "$DISTRIBUTION"

    - name: Verify and export system Qt environment
      shell: bash
      run: |
        set -euo pipefail
        packaging/linux/verify-system-qt.sh
        {
          echo "QT_ROOT_DIR=/usr"
          echo "QT_VERSION=$(pkg-config --modversion Qt6Core)"
        } >> "$GITHUB_ENV"

    - name: Identify isolated Fedora EAC3 dependency build
      if: inputs.distribution == 'fedora'
      id: eac3-identity
      shell: bash
      run: |
        set -euo pipefail
        echo "CIRRUS_EAC3_FFMPEG_PREFIX=$GITHUB_WORKSPACE/build-fedora-eac3" >> "$GITHUB_ENV"
        fingerprint=$(rpm -q gcc gcc-c++ glibc-devel binutils nasm | sha256sum | cut -d' ' -f1)
        echo "toolchain=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore isolated Fedora EAC3 dependency
      if: inputs.distribution == 'fedora'
      id: eac3
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.CIRRUS_EAC3_FFMPEG_PREFIX }}
        key: fedora44-eac3-${{ inputs.arch }}-${{ steps.eac3-identity.outputs.toolchain }}-${{ hashFiles('packaging/versions.sh', 'packaging/linux/fedora/build-eac3-ffmpeg.sh') }}

    - name: Build isolated Fedora EAC3 dependency
      if: inputs.distribution == 'fedora' && steps.eac3.outputs.cache-hit != 'true'
      shell: bash
      run: packaging/linux/fedora/build-eac3-ffmpeg.sh "$CIRRUS_EAC3_FFMPEG_PREFIX"

    - name: Verify isolated Fedora EAC3 dependency identity
      if: inputs.distribution == 'fedora'
      shell: bash
      run: |
        set -euo pipefail
        source packaging/versions.sh
        read -r version digest native < "$CIRRUS_EAC3_FFMPEG_PREFIX/complete"
        [[ $version == "$FFMPEG_VERSION" && $digest == "$FFMPEG_SHA256" && $native == "$(uname -m)" ]]

    - name: Save isolated Fedora EAC3 dependency
      if: inputs.distribution == 'fedora' && steps.eac3.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.CIRRUS_EAC3_FFMPEG_PREFIX }}
        key: ${{ steps.eac3.outputs.cache-primary-key }}

    - name: Verify distribution FFmpeg and baseline audio formats
      shell: bash
      run: packaging/linux/verify-system-ffmpeg.sh

    - name: Export common build environment
      shell: bash
      env:
        DISTRIBUTION: ${{ inputs.distribution }}
      run: |
        set -euo pipefail
        {
          echo "CIRRUS_CMAKE_PREFIX_PATH=/usr"
          echo "CIRRUS_PKG_CONFIG_EXECUTABLE=$(command -v pkg-config)"
          echo "CIRRUS_OPENSSL_ROOT=/usr"
          echo "CIRRUS_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
        mkdir -p "$CCACHE_DIR"

    - name: Restore native compiler output
      id: compiler
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-linux-${{ inputs.distribution }}-${{ inputs.arch }}-qt${{ env.QT_VERSION }}-${{ inputs.cache-scope }}-${{ hashFiles('packaging/*.sh', 'packaging/linux/install-build-deps.sh', '.github/actions/setup-linux/action.yml', '.github/actions/setup-qt/action.yml', '**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-${{ inputs.distribution }}-${{ inputs.arch }}-qt${{ env.QT_VERSION }}-${{ inputs.cache-scope }}-

    - name: Export compiler-cache identity
      shell: bash
      env:
        CACHE_KEY: ${{ steps.compiler.outputs.cache-primary-key }}
        CACHE_HIT: ${{ steps.compiler.outputs.cache-hit }}
      run: |
        printf 'CIRRUS_CCACHE_KEY=%s\nCIRRUS_CCACHE_HIT=%s\n' "$CACHE_KEY" "$CACHE_HIT" >> "$GITHUB_ENV"
