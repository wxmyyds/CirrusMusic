name: 问题反馈
description: 报告崩溃、播放失败、加载不出来、界面显示错误等问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交之前请先：

        - [搜索已有的 Issues](https://github.com/Guang233/CirrusMusic/issues?q=is%3Aissue)，看看是不是已经有人报告过；
        - 更新到 [最新版本](https://github.com/Guang233/CirrusMusic/releases/latest)，确认问题还在。

        **请务必附上诊断包**，没有日志我们很难定位问题。诊断包里有日志和系统、显卡、音频、网络的报告，**不含**账号凭据、缓存和歌单内容。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过已有的 Issues，没有找到相同的问题
          required: true
        - label: 我用的是最新版本，问题仍然存在
          required: true

  - type: input
    id: version
    attributes:
      label: Cirrus 版本
      description: 在 设置 › 关于 里可以看到。
      placeholder: "0.2.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - deb 包
        - RPM 包
        - Arch 原生 pacman 包
        - AUR / PKGBUILD
        - Windows 安装程序
        - Windows 免安装 zip
        - macOS DMG
        - 自己从源码构建
        - 其他
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统和桌面环境
      description: Linux 请写发行版、桌面环境和显示协议；Windows 请写版本号（`winver` 里能看到）。
      placeholder: "Arch Linux / KDE Plasma 6.2 / Wayland；或 Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？可以直接把截图或录屏粘贴到这里。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 怎样能让问题再次出现？如果和某首歌、某个歌单有关，请写上名字或链接。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
      description: 你原本以为会怎样？
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都会
        - 经常
        - 偶尔
        - 只出现过一次
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 诊断包 / 日志
      description: |
        **获取诊断包：**

        1. 出问题后，马上按 `Ctrl+Alt+Shift+D`（或在 设置 › 诊断 里点「记下刚才的问题」），把这一刻标记进日志；
        2. 打开 设置 › 诊断 › 导出诊断包，保存为 `.zip`；
        3. 把 zip 文件拖到下面的输入框里上传。

        如果问题很久才出现一次，可以先在 设置 › 诊断 里打开「详细日志」（24 小时后自动关闭），等问题再次出现后再导出。

        **应用打不开、没法导出时**，请把日志文件夹打包上传：

        - Linux：`~/.local/state/Cirrus/logs/`
        - Windows：`%LOCALAPPDATA%\Cirrus\logs\`

        也可以从终端启动 Cirrus，把终端里的输出粘贴进来。
      placeholder: 把诊断包 zip 拖到这里上传
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 还有什么可能有关的？比如问题从哪个版本开始出现、是否用了代理、声卡或音频服务（PipeWire、PulseAudio）等。
    validations:
      required: false
